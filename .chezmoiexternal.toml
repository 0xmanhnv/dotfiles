# External git repos managed by chezmoi (always rendered as a template).
#
# zsh plugins: cloned on first `chezmoi apply`, then fast-forwarded at most
# once a week (refreshPeriod) — or immediately with
# `chezmoi apply --refresh-externals`. Unlike a run_once script they also
# get installed by `bootstrap.sh --minimal`, which excludes scripts.
# ~/.zshrc sources them from ~/.local/share/zsh/plugins/<name>/.
#
# Order of sourcing lives in dot_zshrc.tmpl; this list is just the set.
{{- $plugins := list
      "zsh-users/zsh-autosuggestions"
      "Aloxaf/fzf-tab"
      "zsh-users/zsh-syntax-highlighting"
      "zsh-users/zsh-history-substring-search" }}
{{- range $plugins }}
{{- $name := base . }}

[".local/share/zsh/plugins/{{ $name }}"]
    type = "git-repo"
    url = "https://github.com/{{ . }}.git"
    refreshPeriod = "168h"
    clone.args = ["--depth", "1"]
    pull.args = ["--ff-only"]
{{- end }}

# tmux: TPM plus the plugins declared with `set -g @plugin` in dot_tmux.conf
# (keep both lists in sync). TPM's own first-run bootstrap only cloned tpm,
# never the plugins, so sensible / yank / resurrect / continuum silently
# didn't load. TPM still loads them; chezmoi just makes sure they're there.
{{- $tmuxPlugins := list
      "tmux-plugins/tpm"
      "tmux-plugins/tmux-sensible"
      "tmux-plugins/tmux-yank"
      "tmux-plugins/tmux-resurrect"
      "tmux-plugins/tmux-continuum" }}
{{- range $tmuxPlugins }}

[".tmux/plugins/{{ base . }}"]
    type = "git-repo"
    url = "https://github.com/{{ . }}.git"
    refreshPeriod = "168h"
    clone.args = ["--depth", "1"]
    pull.args = ["--ff-only"]
{{- end }}
