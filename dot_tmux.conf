# =============================================================================
# tmux.conf — tuned for Neovim
# Reload: <prefix> r        Prefix: C-a (replaces default C-b)
# =============================================================================

# ----- Prefix ----------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ----- Terminal & color ------------------------------------------------------
# Inside tmux $TERM is `tmux-256color`; outer terminal capabilities are layered
# on via terminal-features (tmux 3.2+). This is what lets Neovim get truecolor,
# undercurl (LSP wavy lines), styled underlines, and OSC 8 hyperlinks.
set  -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",*:usstyle"     # styled/colored underlines (undercurl)
set -as terminal-features ",*:hyperlinks"  # OSC 8

# CSI-u: lets Neovim distinguish <C-i> from <Tab>, <C-Tab>, <C-Shift-key>, etc.
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# ----- Sane defaults ---------------------------------------------------------
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10            # avoid <Esc> lag in Neovim insert→normal
set -g history-limit 50000
set -g focus-events on           # lets Neovim's FocusGained/Lost fire
set -g set-clipboard on          # OSC 52 — yank inside tmux ends up on host clipboard
set -g detach-on-destroy off     # don't kill tmux when last session window closes

# ----- Reload ----------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "config reloaded"

# ----- Splits keep current path ---------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ----- vim-tmux-navigator (seamless C-h/j/k/l between Neovim splits & tmux panes)
# Neovim must have the matching plugin (christoomey/vim-tmux-navigator). When the
# focused pane runs vim/nvim/fzf, the keystroke is forwarded; otherwise tmux moves.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# C-l above shadows clear-screen; restore via <prefix> C-l
bind C-l send-keys 'C-l'

# ----- Resize panes (repeatable while -r holds) -----------------------------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ----- Vi copy mode ----------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# Drag-to-select: copy on mouse release without leaving copy-mode
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear

# ----- Status bar ------------------------------------------------------------
set -g status-position top
set -g status-style "bg=default fg=white"
set -g status-left  "#[fg=green,bold]#S "
set -g status-right "#[fg=yellow]%Y-%m-%d %H:%M"
set -g status-interval 5

# ----- Plugins (TPM) ---------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'        # `y` in copy-mode → system clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (keep at the very bottom)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'