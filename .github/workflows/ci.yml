name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every verification goes through `check "<label>" <command...>`, which prints
# ✓/✗ and exits non-zero on failure. (The old `test ... && echo ✓` style never
# failed a job: a false `&&` list doesn't trip `set -e`.)

jobs:
  lint:
    name: lint (shellcheck, zsh -n, tmux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh shellcheck tmux
          sh -c "$(curl --proto =https -fsLS https://get.chezmoi.io)" -- -b /usr/local/bin
      - name: Render templates
        run: |
          set -euo pipefail
          mkdir -p /tmp/render
          for f in run_*.tmpl; do
            chezmoi --source="$PWD" execute-template < "$f" > "/tmp/render/${f%.tmpl}"
          done
          chezmoi --source="$PWD" execute-template < dot_zshrc.tmpl > /tmp/render/zshrc
          chezmoi --source="$PWD" execute-template < .chezmoiexternal.toml > /tmp/render/externals.toml
      - name: shellcheck (scripts/ + rendered run_* scripts)
        # SC1090/SC1091: shellcheck can't follow dynamic `source` paths — fine,
        # we guard them at runtime with [[ -s ]] / command -v.
        run: shellcheck -S warning -e SC1090 -e SC1091 scripts/*.sh /tmp/render/*.sh
      - name: zsh -n (syntax check every zsh file)
        run: |
          set -euo pipefail
          for f in dot_zshenv dot_config/zsh/*.zsh /tmp/render/zshrc; do
            zsh -n "$f" || { echo "✗ $f"; exit 1; }
            echo "✓ $f"
          done
      - name: tmux config parses
        run: tmux -L ci -f /dev/null start-server \; source-file -n dot_tmux.conf

  # Mirrors `bootstrap.sh --minimal` on the primary OS: dotfiles + externals,
  # no run_* scripts. Catches macOS-only template branches and zsh startup
  # errors that the Linux containers never render.
  macos-minimal:
    name: apply --exclude=scripts (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply and verify
        run: |
          set -euo pipefail
          check() { local m="$1"; shift; if "$@"; then echo "✓ $m"; else echo "✗ $m"; exit 1; fi; }
          brew install -q chezmoi
          # Hosted runners leave brew's zsh dirs group-writable, which makes
          # compinit stop and ask about "insecure directories" (brew's
          # documented fix; a normal brew install doesn't need it).
          chmod -R go-w "$(brew --prefix)/share/zsh"
          chezmoi --source="$PWD" apply --exclude=scripts --verbose

          check "~/.zshrc"                 test -f ~/.zshrc
          check "~/.config/zsh/05-brew"    test -f ~/.config/zsh/05-brew.zsh
          check "ghostty config"           test -f ~/.config/ghostty/config
          check "nvim config"              test -f ~/.config/nvim/init.lua
          check "linux module skipped"     test ! -e ~/.config/zsh/40-linux.zsh
          # Externals are not scripts, so --minimal must still get plugins
          for p in zsh-autosuggestions fzf-tab zsh-syntax-highlighting zsh-history-substring-search; do
            check "plugin $p" test -d ~/.local/share/zsh/plugins/$p/.git
          done
          for p in tpm tmux-sensible tmux-yank tmux-resurrect tmux-continuum; do
            check "tmux plugin $p" test -d ~/.tmux/plugins/$p/.git
          done

          # Shell starts without errors. Run it under a pseudo-terminal
          # (`script`): without a TTY, zle can't load and every interactive
          # zsh complains — a CI artifact, not a dotfiles bug. The PTY merges
          # stdout/stderr, so look for zsh's error shapes instead.
          out="$(script -q /dev/null zsh -lic exit 2>&1 || true)"
          if grep -Eiq "command not found|no such file|parse error|bad (pattern|substitution)|not found:|insecure directories" <<<"$out"; then
            echo "✗ zsh startup errors:"; echo "$out"; exit 1
          fi
          echo "✓ zsh starts cleanly"
          check "gst alias"  zsh -lic 'type gst >/dev/null'
          check "take fn"    zsh -lic 'type take >/dev/null'
          check "brew on PATH before modules" zsh -lic '[[ -n $BREW_PREFIX ]]'
          # ${#${(u)path}} would count characters of the joined string;
          # collect into an array first. The inner zsh = a nested shell.
          check "no duplicate PATH entries" \
            zsh -lic 'u=(${(u)path}); (( ${#path} == ${#u} ))'
          check "no duplicates in a nested shell" \
            zsh -lic 'zsh -ic '"'"'u=(${(u)path}); (( ${#path} == ${#u} ))'"'"

  bootstrap-ubuntu:
    name: bootstrap end-to-end (Ubuntu 24.04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply this dotfiles repo via chezmoi inside Ubuntu container
        run: |
          docker run --rm -v "$PWD:/dotfiles:ro" ubuntu:24.04 bash -c '
            set -euo pipefail
            check() { local m="$1"; shift; if "$@"; then echo "✓ $m"; else echo "✗ $m"; exit 1; fi; }
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq curl sudo git ca-certificates

            # Install chezmoi binary
            sh -c "$(curl --proto =https -fsLS https://get.chezmoi.io)" -- -b /usr/local/bin

            # --source flag on every invocation bypasses the need for a config
            # file and avoids "chezmoi init --source=DIR" not persisting the
            # source path the way you would expect.
            chezmoi --source=/dotfiles apply --verbose

            echo
            echo "===== POST-APPLY VERIFICATION ====="
            check "~/.zshrc"              test -f ~/.zshrc
            check "~/.config/zsh/"        test -d ~/.config/zsh
            check "darwin module skipped" test ! -e ~/.config/zsh/40-darwin.zsh
            for p in zsh-autosuggestions fzf-tab zsh-syntax-highlighting zsh-history-substring-search; do
              check "plugin $p" test -d ~/.local/share/zsh/plugins/$p
            done

            # Shell loads cleanly + aliases work
            check "gst alias" zsh -lic "type gst >/dev/null"
            check "take fn"   zsh -lic "type take >/dev/null"
            check "starship"  zsh -lic "command -v starship >/dev/null"
            check "nvim"      zsh -lic "command -v nvim >/dev/null"
            check "delta"     zsh -lic "command -v delta >/dev/null"
          '

  bootstrap-fedora:
    name: bootstrap end-to-end (Fedora)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply via chezmoi inside Fedora container
        run: |
          docker run --rm -v "$PWD:/dotfiles:ro" fedora:latest bash -c '
            set -euo pipefail
            check() { local m="$1"; shift; if "$@"; then echo "✓ $m"; else echo "✗ $m"; exit 1; fi; }
            dnf install -y -q curl sudo git

            sh -c "$(curl --proto =https -fsLS https://get.chezmoi.io)" -- -b /usr/local/bin

            chezmoi --source=/dotfiles apply --verbose

            check "gst alias" zsh -lic "type gst >/dev/null"
            check "starship"  zsh -lic "command -v starship >/dev/null"
          '

  bootstrap-kali:
    name: bootstrap end-to-end (Kali rolling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply via chezmoi inside Kali container
        run: |
          docker run --rm -v "$PWD:/dotfiles:ro" kalilinux/kali-rolling bash -c '
            set -euo pipefail
            check() { local m="$1"; shift; if "$@"; then echo "✓ $m"; else echo "✗ $m"; exit 1; fi; }
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq curl sudo git ca-certificates

            sh -c "$(curl --proto =https -fsLS https://get.chezmoi.io)" -- -b /usr/local/bin

            chezmoi --source=/dotfiles apply --verbose

            check "gst alias" zsh -lic "type gst >/dev/null"
            check "starship"  zsh -lic "command -v starship >/dev/null"
          '

  # Debian 12 is the explicit target for the apt-cache-policy filter and the
  # eza/zoxide/yq/openjdk-21 fallback installers — bookworm is the minimal
  # supported Debian and is what Parrot 6 / Kali 2024.x are based on. The
  # Ubuntu/Fedora/Kali jobs above don't reliably trigger the fallback paths
  # because their repos have most of the modern tools.
  bootstrap-debian-bookworm:
    name: bootstrap end-to-end (Debian 12 bookworm — exercises fallbacks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply via chezmoi inside Debian bookworm container
        run: |
          docker run --rm -v "$PWD:/dotfiles:ro" debian:12-slim bash -c '
            set -euo pipefail
            check() { local m="$1"; shift; if "$@"; then echo "✓ $m"; else echo "✗ $m"; exit 1; fi; }
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq curl sudo git ca-certificates gpg

            sh -c "$(curl --proto =https -fsLS https://get.chezmoi.io)" -- -b /usr/local/bin

            chezmoi --source=/dotfiles apply --verbose

            echo
            echo "===== FALLBACK INSTALLER VERIFICATION ====="
            check "eza (deb.gierens.de fallback)"     command -v eza
            check "zoxide (install-script fallback)"  command -v zoxide
            check "yq (GitHub-release fallback)"      command -v yq
            check "starship"                          command -v starship
            check "neovim (tarball fallback for too-old apt nvim)" \
              test -x /opt/nvim-linux-x86_64/bin/nvim
            check "JetBrainsMono Nerd Font installed" \
              test -d "$HOME/.local/share/fonts/JetBrainsMonoNerdFont"
            check "delta (GitHub-release fallback)"   command -v delta
            check "yq is mikefarah/yq, not the Python wrapper" \
              sh -c "yq --version | grep -qi mikefarah"
            check "bat / fd under their usual names" \
              sh -c "PATH=\$HOME/.local/bin:\$PATH; command -v bat && command -v fd"
          '

  # Render-only test for nerd_font=false. No Docker — just feed each template
  # through `chezmoi execute-template` against a temp source dir whose
  # .chezmoidata.yaml flips the flag, then assert the ASCII branch landed.
  template-nerd-font-false:
    name: template render (nerd_font=false ASCII fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install chezmoi
        run: sh -c "$(curl --proto =https -fsLS https://get.chezmoi.io)" -- -b /usr/local/bin
      - name: Render templates with nerd_font=false and assert ASCII output
        run: |
          set -euo pipefail
          check()     { local m="$1"; shift; if "$@"; then echo "✓ $m"; else echo "✗ $m"; exit 1; fi; }
          has()       { grep -q -- "$1" <<<"$2"; }
          lacks()     { ! grep -q -- "$1" <<<"$2"; }
          src="$(mktemp -d)"
          cp -r "$PWD"/. "$src/"
          sed -i "s/^nerd_font: true/nerd_font: false/" "$src/.chezmoidata.yaml"

          starship_out="$(chezmoi --source="$src" execute-template < "$src/dot_config/starship.toml.tmpl")"
          ghostty_out="$(chezmoi --source="$src" execute-template < "$src/dot_config/ghostty/config.tmpl")"
          zshrc_out="$(chezmoi --source="$src" execute-template < "$src/dot_zshrc.tmpl")"

          # Starship: ASCII labels, no clock glyph, no Nerd Font OS icons
          check "starship Macos = mac"         has '^Macos = "mac"'     "$starship_out"
          check "starship Debian = debian"     has '^Debian = "debian"' "$starship_out"
          check "no clock glyph"               lacks "󰥔"                "$starship_out"
          check "no macos nerd glyph"          lacks "󰀵"                "$starship_out"

          # Ghostty: plain JetBrains Mono, not the Nerd Font variant
          check "ghostty plain font"           has '^font-family = JetBrains Mono$' "$ghostty_out"
          check "no Nerd Font in ghostty"      lacks "JetBrainsMono Nerd Font"      "$ghostty_out"

          # zshrc fzf-tab previews drop --icons
          check "fzf-tab previews drop --icons" lacks "eza .* --icons" "$zshrc_out"
