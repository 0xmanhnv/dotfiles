# Machine profile — controls which GUI/desktop-only configs apply.
# Override per-machine in ~/.config/chezmoi/chezmoi.toml:
#
#   [data]
#   profile = "server"
#
# Values:
#   desktop  - default; render all configs including GUI (Ghostty, fonts, ...)
#   server   - headless; skip GUI configs (Ghostty, etc.)
profile: "desktop"

# Render Nerd Font glyphs (OS icons, file-type icons, clock) in the starship
# prompt and use eza --icons. Default true matches the primary workstation
# (macOS via Brewfile installs the font automatically; Linux's run_once
# fetches it from the official Nerd Fonts release).
#
# Set to false per-machine in ~/.config/chezmoi/chezmoi.toml on terminals
# that can't render Nerd Font glyphs (plain xterm, Linux console, some SSH
# clients, WSL when Windows Terminal isn't configured with a Nerd Font):
#
#   [data]
#   nerd_font = false
#
# In that mode, starship falls back to ASCII labels and eza drops --icons.
nerd_font: true

# Install offensive-security toolkit (nmap, ffuf, sqlmap, hashcat, ghidra,
# burp-suite, ...). Default false: dev-only machines stay lean. Override
# per-machine in ~/.config/chezmoi/chezmoi.toml on the pentest box:
#
#   [data]
#   pentest = true
#
# When true, the install script also pulls Brewfile.pentest /
# packages/{apt,dnf,pacman}.pentest.txt on top of the base lists.
pentest: false

# Opt out of zsh-syntax-highlighting on machines where typing feels laggy
# or characters get duplicated/lost — typically code-server's xterm.js
# over WebSocket, SSH over high-RTT links, or low-CPU VMs. The plugin re-
# parses the whole command buffer on every keystroke, and on slow front-
# ends that compounds with network latency until the visible buffer
# diverges from zsh's internal state. autosuggestions stays on (it's
# already async after this change).
#
# Override per-machine in ~/.config/chezmoi/chezmoi.toml:
#
#   [data]
#   slow_terminal = true
slow_terminal: false
