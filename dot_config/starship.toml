"$schema" = 'https://starship.rs/config-schema.json'

# Custom Catppuccin preset — info-rich but no segment backgrounds.
# Multi-line layout, foreground colors only, palette = Catppuccin Mocha.
# Always-on info: OS icon, user, hostname (when SSH), directory, time.
# Context-aware: git, language version, docker, conda, cmd duration, exit status.

palette = 'catppuccin_mocha'

format = """
$os \
$username\
$hostname \
$directory\
$git_branch\
$git_status\
$nodejs$bun$python$rust$golang$java$kotlin$haskell$php$c\
$docker_context\
$conda\
$cmd_duration\
$time \
$character"""

add_newline = true

[os]
disabled = false
style = "fg:peach"
format = '[$symbol]($style)'

[os.symbols]
Macos = "󰀵"
Linux = "󰌽"
Ubuntu = "󰕈"
Arch = "󰣇"
Fedora = "󰣛"
Debian = "󰣚"
Alpine = ""

[username]
show_always = true
style_user = "fg:lavender"
style_root = "bold fg:red"
format = '[$user]($style)'

[hostname]
ssh_only = true
style = "fg:teal"
format = '[@$hostname]($style)'

[directory]
style = "bold fg:sky"
format = " [$path]($style) "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:mauve"
format = 'on [$symbol $branch]($style) '

[git_status]
style = "fg:peach"
format = '([\[$all_status$ahead_behind\]]($style) )'

[nodejs]
symbol = ""
style = "fg:green"
format = 'via [$symbol $version]($style) '

[bun]
symbol = ""
style = "fg:flamingo"
format = 'via [$symbol $version]($style) '

[python]
symbol = ""
style = "fg:yellow"
format = 'via [$symbol $version$virtualenv]($style) '

[rust]
symbol = ""
style = "fg:peach"
format = 'via [$symbol $version]($style) '

[golang]
symbol = ""
style = "fg:teal"
format = 'via [$symbol $version]($style) '

[java]
symbol = " "
style = "fg:red"
format = 'via [$symbol$version]($style) '

[kotlin]
symbol = ""
style = "fg:lavender"
format = 'via [$symbol $version]($style) '

[haskell]
symbol = ""
style = "fg:mauve"
format = 'via [$symbol $version]($style) '

[php]
symbol = ""
style = "fg:lavender"
format = 'via [$symbol $version]($style) '

[c]
symbol = " "
style = "fg:green"
format = 'via [$symbol$version]($style) '

[docker_context]
symbol = ""
style = "fg:blue"
format = 'via [$symbol $context]($style) '

[conda]
symbol = " "
style = "fg:sapphire"
format = '[$symbol$environment]($style) '
ignore_base = false

[cmd_duration]
min_time = 2000
style = "fg:yellow"
format = 'took [$duration]($style) '

[time]
disabled = false
time_format = "%H:%M"
style = "fg:overlay1"
format = '[󰥔 $time]($style)'

[line_break]
disabled = false

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
